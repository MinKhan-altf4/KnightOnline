name: Server CI

on:
  push:
    paths:
      - "KnightServer/**"
      - "KnightServer.Tests/**"
      - "KnightClient/Assets/_Project/Scripts/Shared/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "KnightServer/**"
      - "KnightServer.Tests/**"
      - "KnightClient/Assets/_Project/Scripts/Shared/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore KnightServer.Tests/KnightServer.Tests.csproj

      - name: Build
        run: >
          dotnet build KnightServer.Tests/KnightServer.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test KnightServer.Tests/KnightServer.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=minimal"
