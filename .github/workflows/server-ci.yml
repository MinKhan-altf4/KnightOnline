name: Server CI

on:
  push:
    paths:
      - "KnightServer/**"
      - "KnightServer.Tests/**"
      - "KnightServer.IntegrationTests/**"
      - "KnightClient/Assets/_Project/Scripts/Shared/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "KnightServer/**"
      - "KnightServer.Tests/**"
      - "KnightServer.IntegrationTests/**"
      - "KnightClient/Assets/_Project/Scripts/Shared/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway database for this job only; credentials are not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knight_ci
          POSTGRES_PASSWORD: knight_ci
          POSTGRES_DB: knightonline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knight_ci -d knightonline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_POSTGRES: "Host=localhost;Port=5432;Database=knightonline_ci;Username=knight_ci;Password=knight_ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore KnightServer.Tests/KnightServer.Tests.csproj
          dotnet restore KnightServer.IntegrationTests/KnightServer.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build KnightServer.Tests/KnightServer.Tests.csproj --configuration Release --no-restore
          dotnet build KnightServer.IntegrationTests/KnightServer.IntegrationTests.csproj --configuration Release --no-restore

      - name: Unit tests
        env:
          KNIGHTONLINE_TEST_POSTGRES_CONNECTION: ${{ env.CI_POSTGRES }}
        run: >
          dotnet test KnightServer.Tests/KnightServer.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=minimal"

      - name: Integration tests (PostgreSQL)
        env:
          KNIGHTONLINE_ConnectionStrings__KnightOnline: ${{ env.CI_POSTGRES }}
        run: >
          dotnet test KnightServer.IntegrationTests/KnightServer.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=minimal"
